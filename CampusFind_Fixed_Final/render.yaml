services:
  - type: web
    name: campusfind
    runtime: node
    rootDir: CampusFind_Fixed_Final
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: campusfind

services:
  - type: web
    name: campusfind
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: campusfind
      - key: FRONTEND_ORIGIN
        sync: false
